<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<title>MR Private Label</title>
<rect width="512" height="512" fill="#2D4E71"/>
<!-- O símbolo INTEIRO, "mr", não só o "m". Ele é 2,71:1 (tinta medida:
     2112,75 x 779,41), entao num quadrado ele so pode ser uma faixa —
     nao ha margem morta para recuperar, o glifo ja preenche a caixa.
     Por isso o encaixe e apertado: 12 de folga lateral em 512, contra
     os 52 de antes.
     A ENGORDA de 55 unidades existe porque a cursiva tem fios de cabelo
     que somem antes da letra: sem ela, a 16px o "mr" vira mancha cinza
     uniforme. 55 e o ponto onde o traco fino sobrevive e o olho do "m"
     ainda nao fecha — 95 fecha, 0 some. Sao 7% da altura do glifo,
     invisiveis sem comparacao lado a lado. -->
