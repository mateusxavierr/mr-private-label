<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Gerador do cartão social · MR Private Label</title>
<!-- ══════════════════════════════════════════════════════════════════
     GERADOR DO img/og.jpg. Não faz parte da landing — é a ferramenta
     que desenha o cartão, e existe para que ele seja REFAZÍVEL: sem
     ela, o og.jpg é um binário que ninguém sabe reproduzir.

     Como usar: abrir `tools/og.html` num servidor local (o caminho das
     fontes e das fotos é relativo à raiz do projeto, então servir a
     raiz e navegar até /tools/og.html), esperar o título virar PRONTO,
     e salvar `window.__jpg` — base64 de um JPEG 1200×630 — em img/og.jpg.
     Para trocar a peça da foto: `?p=08`, com o número de 01 a 13.

     É canvas, e não HTML renderizado, porque o cartão precisa sair em
     1200×630 EXATOS. Captura de tela depende do que a janela permite e
     reescala; o canvas devolve o pixel pedido.
     ══════════════════════════════════════════════════════════════════ -->
<style>
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 900;
  src:url(../fonts/pf-rm-latin.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400 900;
  src:url(../fonts/pf-it-latin.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400 700;
  src:url(../fonts/is-rm-latin.woff2) format('woff2')}
body{background:#6b6b6b;margin:0;padding:14px;font:12px system-ui;color:#fff}
canvas#c{width:1200px;height:630px;display:block;box-shadow:0 6px 40px #0006}
</style>
<canvas id="c" width="1200" height="630"></canvas>
<script>
const AZUL='#2D4E71', INK='#071623', FLD='#BBC8D4', BG='#F8FCFF';
const P1="M111.25,770.48l50.82-211.5,67.3-339.24c10.51-52.64,15.78-86.97,15.78-103,0-28.38-13.5-42.57-40.52-42.57-44.87,0-113.06,50.3-204.63,150.93l12.37-63.1C112.17,54,202.12,0,282.24,0c65.94,0,98.88,34.6,98.88,103.78,0,23.38-5.27,62.09-15.78,116.17l-33.65,169.77h9.62c58.57-119.14,122.56-213.87,191.94-284.22C602.59,35.18,666.55,0,725.15,0c30.69,0,56.44,12.15,77.28,36.43,20.81,24.28,31.22,54.52,31.22,90.73,0,26.58-3.88,58.42-11.66,95.54l-32.97,167.01h9.62c50.82-114.55,110.78-208.15,179.92-280.78C1047.67,36.32,1111.09,0,1168.78,0c81.04,0,121.55,43.03,121.55,129.1,0,25.65-3.67,57.23-11.01,94.77l-66.59,335.11c-10.54,52.64-15.8,86.98-15.8,103,0,28.84,13.5,43.26,40.52,43.26,45.31,0,117.87-56.02,208.97-156.62l-16.68,69.52c-100.01,107.53-190.13,161.27-270.4,161.27-66.5,0-99.74-34.52-99.74-103.59,0-22.4,5.51-61.27,16.6-116.61l67.1-334.78c6.45-30.17,9.68-52.12,9.68-65.84,0-37.97-14.18-56.94-42.56-56.94-79.67,0-195.04,137.42-346.1,412.22l-51.5,248.38-134.61,8.24,107.82-544.68c5.95-30.19,8.94-52.13,8.94-65.85,0-38.86-13.73-58.31-41.23-58.31-34.33,0-85.03,40.24-152.1,120.73-67.07,80.49-132.42,179.49-196.05,297l-50.14,242.87-144.2,8.24Z";
const P2="M1400.65,770.48l50.82-211.31,66.59-335.46c6.87-33.83,10.3-63.1,10.3-87.8,0-39.33-13.73-59-41.2-59-48.54,0-112.66,51.69-202.84,155.07l10.48-59.76C1400.55,58.27,1489,0,1566.84,0c65.91,0,98.88,37.75,98.88,113.22,0,33.4-4.14,70.44-12.37,111.15l-32.97,165.39h8.94c54.46-114.57,118.89-208.15,193.3-280.8C1897.02,36.32,1965.12,0,2026.92,0c32.02,0,60.64,7.16,85.83,21.49l-91.34,124.05c-27.02-17.83-49.9-26.74-68.66-26.74-89.26,0-208.07,131.01-356.4,393.06l-50.14,250.39-145.56,8.23Z";

// SEM GRAO, por decisao de Mateus (2026-07-29). O cartao teve textura em
// duas camadas — a fina da pagina e uma malha grossa que sobrevivia a
// reamostragem do WhatsApp — e depois so no fundo, fora da peca. Saiu
// inteira: a superficie do cartao e lisa.
// Aqui a textura tinha menos a defender do que na pagina. Na tela ela
// existe para nao deixar superficie lisa num scroll longo; num cartao
// que dura meio segundo numa lista de conversa, ela e so ruido a mais
// para o JPEG codificar.

const W=1200,H=630,PAD=64;
const load=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
const mix=(hex,a)=>{const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
// curva em S — os mesmos 16 pontos da dissolucao da vitrine no mobile
const EASE=[[0,1],[.081,.987],[.155,.951],[.225,.896],[.29,.825],[.353,.741],
 [.412,.648],[.471,.55],[.529,.45],[.588,.352],[.647,.259],[.71,.175],
 [.775,.104],[.845,.049],[.919,.013],[1,0]];

async function draw(peca){
 const cv=document.getElementById('c'), g=cv.getContext('2d');
 g.clearRect(0,0,W,H);
 g.fillStyle=BG; g.fillRect(0,0,W,H);

 // o palco: a luz nasce embaixo, no eixo da figura
 const rg=g.createRadialGradient(W*.68,H*.88,0,W*.68,H*.88,W*.46);
 rg.addColorStop(0,mix(FLD,.52)); rg.addColorStop(.74,mix(FLD,0)); rg.addColorStop(1,mix(FLD,0));
 g.fillStyle=rg; g.fillRect(0,0,W,H);
 const lg=g.createLinearGradient(0,H,0,0);
 lg.addColorStop(0,mix(FLD,0)); lg.addColorStop(.15,mix(FLD,.26)); lg.addColorStop(.56,mix(FLD,0));
 g.fillStyle=lg; g.fillRect(0,0,W,H);

 // ── O CAMPO DE MARCA, EM TAMANHO DE POSTER ────────────────────────
 // So o simbolo, sem o par Private/Label. A trava completa mede ~1,8x a
 // largura do "mr", e para caber inteira num cartao de 1200 o simbolo
 // teria de encolher para ~620 — menor do que ele precisa ser aqui. O
 // brandbook tem pagina de "So simbolo", e e essa que vale: o nome
 // completo ja vai no og:site_name, que e o que o WhatsApp imprime em
 // cima da imagem. O corpo cobre o meio da trava e as duas pontas
 // continuam legiveis, que e a mesma leitura do hero.
 const MW=1010, esc=MW/2110, MH=790*esc, mx=PAD-24, my=96;
 g.save(); g.translate(mx,my); g.scale(esc,esc);
 g.fillStyle=FLD; g.fill(new Path2D(P1)); g.fill(new Path2D(P2));
 g.restore();

 // ── A FIGURA ATRAVESSA A TRAVA ────────────────────────────────────
 // SO A BAINHA DISSOLVE. As treze fotos ja vem com FUNDO TRANSPARENTE
 // (conferido: o pixel de fundo do 13-1120.webp le 0,0,0,0), entao a
 // silhueta entra recortada por conta propria — o grao e o degradê
 // correm por tras do corpo e a trava de marca reaparece em volta dele,
 // sem nada a fazer.
 //
 // Havia rampa nas duas laterais tambem, escrita para esconder a borda
 // de uma caixa branca que NAO EXISTE. Sem caixa para esconder, o que
 // ela escondia era a peca: a manga entrava nos 40px da rampa e virava
 // uma cunha cinza esmaecida, com o corte reto no fim do degradê. O
 // defeito era a correcao.
 const FW=436, FH=600, fx=W-PAD-FW-16, fy=24;
 const off=document.createElement('canvas'); off.width=FW; off.height=FH;
 const o=off.getContext('2d');
 const img=await load('../img/vitrine/'+peca+'-1120.webp');
 const s=Math.max(FW/img.width,FH/img.height);
 o.drawImage(img,(FW-img.width*s)/2,0,img.width*s,img.height*s);
 o.globalCompositeOperation='destination-out';
 const ramp=(x0,y0,x1,y1)=>{const q=o.createLinearGradient(x0,y0,x1,y1);
   EASE.forEach(([p,a])=>q.addColorStop(p,`rgba(0,0,0,${1-a})`)); return q};
 o.fillStyle=ramp(0,FH*.70,0,FH); o.fillRect(0,FH*.70,FW,FH*.30);
 g.drawImage(off,fx,fy);

 // ── A MENSAGEM ────────────────────────────────────────────────────
 g.textBaseline='alphabetic';
 const TS=74, L1=438, L2=438+TS*1.06;
 g.font=`600 ${TS}px 'Playfair Display'`; g.fillStyle=INK;
 g.fillText('Nossa fábrica.', PAD, L1);
 g.font=`italic 600 ${TS}px 'Playfair Display'`;
 const wIt=g.measureText('Sua marca').width;
 g.fillStyle=AZUL; g.fillText('Sua marca', PAD, L2);
 g.font=`600 ${TS}px 'Playfair Display'`; g.fillStyle=INK;
 g.fillText(' na peça.', PAD+wIt, L2);

 // ── A FITA DE PROVA ───────────────────────────────────────────────
 const FS=16; g.font=`620 ${FS}px 'Instrument Sans'`; g.letterSpacing=`${FS*.15}px`;
 let cx=PAD; const y=H-46;
 const itens=['PRODUÇÃO PRÓPRIA','40 MIL PEÇAS/MÊS','TAQUARITINGA DO NORTE/PE'];
 itens.forEach((t,i)=>{
   g.fillStyle=AZUL; g.fillText(t,cx,y); cx+=g.measureText(t).width+24;
   if(i<itens.length-1){g.fillStyle=FLD;g.beginPath();g.arc(cx-12,y-5,2.8,0,7);g.fill();}
 });
 g.letterSpacing='0px';

 return cv.toDataURL('image/jpeg',.92).split(',')[1];
}

// 13 e a azul escura OVERSIZED — a unica peca boxy do conjunto, de ombro
// caido. A 11 tambem e azul escura e e camisa de botao de verdade, mas
// justa; 03 e 04 sao justas tambem.
const peca=new URLSearchParams(location.search).get('p')||'13';
document.fonts.load("600 74px 'Playfair Display'")
 .then(()=>document.fonts.load("italic 600 74px 'Playfair Display'"))
 .then(()=>document.fonts.load("620 16px 'Instrument Sans'"))
 .then(()=>document.fonts.ready)
 .then(()=>draw(peca))
 .then(b64=>{window.__jpg=b64;document.title='PRONTO '+peca+' '+b64.length});
</script>
